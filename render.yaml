services:
  - type: web
    name: pivo-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string — set it in the dashboard once
      - key: ALLOWED_ORIGINS
        sync: false # set to your Netlify URL(s), comma-separated
      - key: WISE_WEBHOOK_PUBLIC_KEY
        sync: false # paste Wise's published webhook public key here
